<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>

    <header>
        <h1>Student Registration</h1>
        <p>Welcome! Please fill out the form below.</p>
    </header>

    <main>

        <form>

            <div class="form-row">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">
            </div>

            <div class="form-row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter password">
            </div>

            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>

            <div class="form-row">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter phone number">
            </div>

            <div class="form-row">
                <label for="birthday">Date of Birth:</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="form-row">
                <label for="major">Choose Your Major:</label>
                <select id="major" name="major">
                    <option value="">Select a major</option>
                    <option value="computer science">Computer Science</option>
                    <option value="business">Business</option>
                    <option value="education">Education</option>
                    <option value="health">Health Science</option>
                </select>
            </div>

            <fieldset>
                <legend>Gender</legend>

                <div class="choice">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                </div>

                <div class="choice">
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Favorite Activities</legend>

                <div class="choice">
                    <input type="checkbox" id="sports" name="activities" value="sports">
                    <label for="sports">Sports</label>
                </div>

                <div class="choice">
                    <input type="checkbox" id="music" name="activities" value="music">
                    <label for="music">Music</label>
                </div>

                <div class="choice">
                    <input type="checkbox" id="travel" name="activities" value="travel">
                    <label for="travel">Travel</label>
                </div>
            </fieldset>

            <div class="form-row">
                <label for="about">Tell Us About Yourself:</label>
                <textarea id="about" name="about" rows="4" placeholder="Write something about yourself..."></textarea>
            </div>

            <div class="choice terms">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms and conditions.</label>
            </div>

            <button type="submit">Submit Registration</button>

        </form>

    </main>

    <footer>
        <p>&copy; Melaia Maiwiriwiri 2026</p>
    </footer>

</body>
</html>
